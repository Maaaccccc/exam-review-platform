<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Review Platform</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Global Application Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">📝</span>
        <h1 class="brand-title">Exam Prep Reviewer</h1>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="btn-icon" aria-label="Toggle light and dark mode">
          <span class="theme-icon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Breadcrumb Navigation Bar -->
  <nav id="breadcrumb-nav" class="breadcrumb-bar" aria-label="Breadcrumb navigation">
    <div class="breadcrumb-container" id="breadcrumb-list">
      <!-- Dynamic breadcrumbs rendered by JS -->
    </div>
  </nav>

  <!-- Main View Container -->
  <main id="app-container" class="app-main">
    <!-- Active View Area managed by JS Router/Store -->
    <section id="view-root" class="view-section" aria-live="polite">
      <div class="loading-spinner-container">
        <div class="spinner"></div>
        <p>Loading examination framework...</p>
      </div>
    </section>
  </main>

  <!-- Mobile Question Navigation Drawer/Modal -->
  <div id="drawer-overlay" class="drawer-overlay" aria-hidden="true"></div>
  <aside id="nav-drawer" class="nav-drawer" aria-labelledby="drawer-title" aria-hidden="true">
    <div class="drawer-header">
      <h3 id="drawer-title">Question Navigator</h3>
      <button id="close-drawer-btn" class="btn-icon" aria-label="Close question drawer">✕</button>
    </div>
    <div class="drawer-legend">
      <span class="legend-item"><span class="badge answered">✓</span> Answered</span>
      <span class="legend-item"><span class="badge marked">⚑</span> Marked</span>
      <span class="legend-item"><span class="badge unanswered">?</span> Unanswered</span>
    </div>
    <div id="drawer-grid" class="question-grid">
      <!-- Navigation buttons dynamically injected here -->
    </div>
  </aside>

  <!-- Footer -->
  <footer class="app-footer">
    <p>&copy; Exam Review Application &bull; Professional Preparation Platform</p>
  </footer>

  <!-- Application JS Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
